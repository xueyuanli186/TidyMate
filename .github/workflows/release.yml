name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag MUST equal "v" + the version in src/tidymate_core/_version.py.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    name: build release assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore (install build dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --upgrade build

      - name: Verify tag matches version
        run: python scripts/version.py --assert-tag "${{ github.ref_name }}"

      - name: Resolve version
        id: version
        shell: pwsh
        run: python scripts/version.py --github-output | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Build portable zip
        run: python scripts/make_dist.py

      # ---------------------------------------------------------------------
      # MSI (WiX v4) - TODO, implemented in the packaging stage.
      # The step is intentionally a no-op that succeeds so this workflow stays
      # runnable end to end. When build/build_msi.py exists, replace the body
      # with:  python build/build_msi.py --version ${{ steps.version.outputs.version }}
      # and add dist/*.msi to the release files list below.
      # ---------------------------------------------------------------------
      - name: Install WiX v4
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build MSI (WiX v4)
        run: >
          python build/build_msi.py
          --version ${{ steps.version.outputs.version }}
          --source dist/TidyMate-${{ steps.version.outputs.version }}-windows
          --output dist/TidyMate-${{ steps.version.outputs.version }}-windows.msi

      - name: List release assets
        shell: pwsh
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.whl
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show collected files
        shell: pwsh
        run: Get-ChildItem artifacts -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # No MSI yet: unmatched files are tolerated instead of failing the run.
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
            artifacts/**/*.whl
          body: |
            TidyMate ${{ needs.build.outputs.version }}

            Assets:
            - `TidyMate-${{ needs.build.outputs.version }}-windows.zip` (portable, sha256 next to it)
            - wheel (for `pip install` on a dev machine)

            **Not included yet:** MSI installer (WiX packaging lands in a later stage).
            This build is a skeleton; it does not move, rename or delete any file.
