# TidyMate - repository level build definition.
#
# Stage 0 note: this file replaces the .NET-era `TidyMate.sln` + `Directory.Build.props`
# pair. It is the ONLY place the version is resolved from, and the version itself lives in
# src/tidymate_core/_version.py (see [tool.hatch.version] below).

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tidymate"
dynamic = ["version"]
description = "Windows local file organiser: previewable, undoable, offline by default."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "TidyMate Project" }]
keywords = ["windows", "file-organiser", "dry-run", "recycle-bin"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# Runtime dependencies are deliberately tiny and network-free (iron rule 9).
dependencies = [
  # `regex` is the only way to put a hard timeout on a user-supplied pattern;
  # the stdlib `re` module cannot do it. No network capability is involved.
  "regex>=2024.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7,<7",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "PyYAML>=6.0.1",
  "ruff>=0.5",
]

[project.scripts]
tidymate = "tidymate_cli.main:app"

[project.urls]
Homepage = "https://github.com/example/tidymate"

[tool.hatch.version]
path = "src/tidymate_core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tidymate_core", "src/tidymate_cli", "src/tidymate_app"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "build", "docs", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# strict mode (replaces <Nullable>enable</Nullable> + <TreatWarningsAsErrors>true)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts", "build"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "yaml.*", "regex"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "build"]
extend-exclude = ["dist", ".venv", "src/TidyMate.Core"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
  "S",   # bandit
  "ANN", # annotations
  "ARG", # unused arguments
  "PTH", # use pathlib
  "T20", # no print() in library code
  "PT",  # pytest style
]
ignore = [
  "ANN401", # Any is acceptable in a few dispatch signatures
  # The repository is bilingual (Chinese docs/comments). Fullwidth punctuation is
  # intentional, not a typo.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "ANN201", "ANN001", "PT011"]
"scripts/**" = ["T201", "ARG002"]      # tools are allowed to print; fakes mirror DirEntry
"scripts/apply_labels.py" = ["T201", "S603"]
"build/**" = ["T201"]
"src/tidymate_cli/**" = ["T201", "B008"]  # CLI output is its job; typer.Option in defaults is idiomatic
"src/tidymate_app/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ---------------------------------------------------------------------------
# tests: warnings are errors (TreatWarningsAsErrors) and coverage is mandatory
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=tidymate_core",
  "--cov=tidymate_cli",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tidymate_core", "tidymate_cli"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
